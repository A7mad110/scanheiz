name: ScanHeiz
options:
  bundleIdPrefix: com.saam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  ScanHeiz:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: ScanHeiz
        PRODUCT_BUNDLE_IDENTIFIER: com.saam.scanheiz
        INFOPLIST_FILE: Sources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SUPPORTS_MACCATALYST: NO
        ENABLE_BITCODE: NO
        SWIFT_EMIT_LOC_STRINGS: NO

schemes:
  ScanHeiz:
    build:
      targets:
        ScanHeiz: all
    run:
      config: Debug
    archive:
      config: Release
